<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n-title="Anmelden">LiveScore · Sign in</title><link rel="stylesheet" href="/static/style.css"><script type="module" src="/static/auth-ui.js"></script></head>
<body><header><strong>LiveScore</strong></header><main>
<h1 data-i18n="Anmelden">Sign in</h1><p id="message" role="alert"></p>
<form id="login-form" class="panel">
<label for="username" data-i18n="Benutzername">Username</label><input id="username" name="username" autocomplete="username" required maxlength="80">
<label for="password" data-i18n="Passwort">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024">
<button type="submit" class="primary" data-i18n="Anmelden">Sign in</button>
</form></main></body></html>
