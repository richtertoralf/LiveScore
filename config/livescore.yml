# Relative Datenpfade beziehen sich auf dieses Config-Verzeichnis.
bind_host: 0.0.0.0
port: 8730
data_dir: ../data
auth:
  enabled: true
  file: auth.yml
  session_hours: 12
  secure_cookie: false
  # Länge neuer Passwörter (Zeichen); vorhandene bleiben gültig.
  password_min_length: 5
  password_max_length: 1024
  # IP-Adressen eigener Reverse Proxys; nur von dort zählt X-Forwarded-For
  # für das Anmeldelimit. Leer: Header werden ignoriert.
  trusted_proxies: []
